name: Update Upstream

on:
  schedule:
    - cron: '0 15 * * *' # Once a day at 5pm GMT+2
  workflow_dispatch: # on button click

jobs:
  upstream:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          cache: 'gradle'
          distribution: 'temurin'
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Update Upstream Commit Hash
        run: |
        set -e
        MC_VERSION=$(grep '^mcVersion' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        PURPUR_LATEST=$(curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/PurpurMC/Purpur/commits/ver/$MC_VERSION" | jq -r '.sha')
        if [ -z "$PURPUR_LATEST" ] || [ "$PURPUR_LATEST" = "null" ] || [ ${#PURPUR_LATEST} -ne 40 ]; then
          echo "Failed to fetch Purpur latest commit (got: '$PURPUR_LATEST')"
          exit 1
        fi
        sed -i "s/^purpurRef = .*/purpurRef = $PURPUR_LATEST/" gradle.properties
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build Paperclip jar
        run: ./gradlew jar :multipaper-server:createPaperclipJar --stacktrace
      - name: Rebuild Patches
        run: ./gradlew rebuildPaperPatches :multipaper-server:rebuildAllServerPatches --stacktrace
      - name: Upload Paperclip jar
        uses: actions/upload-artifact@v4
        with:
          name: multipaper.jar
          path: multipaper-server/build/libs/multipaper-paperclip-*.jar
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Update Upstream
          branch: update-upstream
          delete-branch: true
          title: 'Update Upstream'
          body: ''
